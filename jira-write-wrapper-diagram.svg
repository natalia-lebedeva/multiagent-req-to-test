<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Jira write wrapper flow</title><desc id="desc">Codex starts jira-write-wrapper.mjs, which loads environment configuration and launches the Atlassian Jira MCP. Config exposes only jira_get and jira_post with approval required.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2ff"/></linearGradient><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1l10 5-10 5z" fill="#475569"/></marker><style>
  .title{font:700 36px 'Segoe UI',Arial,sans-serif;fill:#0f172a}.sub{font:400 18px 'Segoe UI',Arial,sans-serif;fill:#475569}.h{font:700 20px 'Segoe UI',Arial,sans-serif;fill:#172033}.p{font:400 15px 'Segoe UI',Arial,sans-serif;fill:#334155}.s{font:600 13px 'Segoe UI',Arial,sans-serif;fill:#64748b}.b{stroke-width:2;rx:18;filter:url(#shadow)}.arrow{fill:none;stroke:#475569;stroke-width:3;marker-end:url(#arrow)}
  </style><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity=".13"/></filter></defs>
  <rect width="1600" height="900" fill="url(#bg)"/><text x="60" y="62" class="title">Jira write wrapper: launch and boundaries</text><text x="60" y="98" class="sub">The wrapper starts the MCP process; configuration sets allowed operations and approval.</text>
  <rect x="60" y="150" width="1480" height="500" rx="28" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <g transform="translate(105 250)"><rect class="b" width="250" height="145" fill="#e8eef5" stroke="none"/><text x="22" y="40" class="h">Codex / MCP host</text><text x="22" y="75" class="p">calls jira_get</text><text x="22" y="104" class="p">or jira_post</text></g>
  <g transform="translate(440 220)"><rect class="b" width="310" height="205" fill="#dcfce7" stroke="#22c55e"/><text x="22" y="38" class="h">jira-write-wrapper.mjs</text><text x="22" y="76" class="p">loadDotEnv('.env')</text><text x="22" y="108" class="p">chooses cmd.exe / npx</text><text x="22" y="140" class="p">spawn(..., stdio: inherit)</text><text x="22" y="176" class="s">forwards exit code / signal</text></g>
  <g transform="translate(835 220)"><rect class="b" width="300" height="205" fill="#cffafe" stroke="#0891b2" stroke-width="5" stroke-dasharray="16 7 3 7"/><text x="22" y="38" class="h">Atlassian Jira MCP</text><text x="22" y="76" class="p">@aashari/... package</text><text x="22" y="110" class="p">jira_get</text><text x="22" y="138" class="p">jira_post</text><text x="22" y="176" class="s">tools from config.toml</text></g>
  <g transform="translate(1220 250)"><rect class="b" width="235" height="145" fill="#f3eee8" stroke="none"/><text x="22" y="40" class="h">Jira REST API</text><text x="22" y="76" class="p">GET /issue</text><text x="22" y="104" class="p">POST /issue</text></g>
  <path class="arrow" d="M355 322H440"/><path class="arrow" d="M750 322H835"/><path class="arrow" d="M1135 322H1220"/>
  <g transform="translate(245 510)"><rect class="b" width="300" height="90" fill="#fff7ed" stroke="#f59e0b"/><text x="20" y="35" class="h">Preview gate</text><text x="20" y="64" class="p">jira-task-preview.md + approval</text></g>
  <g transform="translate(650 510)"><rect class="b" width="300" height="90" fill="#2563eb" stroke="#2563eb"/><text x="20" y="35" class="h" fill="#fff">Allowed operations</text><text x="20" y="64" class="p" fill="#fff">jira_get · jira_post</text></g>
  <g transform="translate(1055 510)"><rect class="b" width="300" height="90" fill="#fee2e2" stroke="#ef4444"/><text x="20" y="35" class="h">Blocked</text><text x="20" y="64" class="p">delete · update · duplicate removal</text></g>
  <path class="arrow" d="M590 555H650"/><path class="arrow" d="M950 555H1055"/>
  <text x="60" y="730" class="s">Note: jira-write-wrapper.mjs does not validate publication or mask data. The publisher Skill checks the workflow; .codex/config.toml limits the available methods.</text>
  <text x="60" y="765" class="s">jira_post is allowed only after the full preview is shown and the user gives separate approval.</text>
</svg>
