<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1900" viewBox="0 0 1800 1900" role="img" aria-labelledby="title desc">
  <title id="title">QA multi-agent architecture</title>
  <desc id="desc">Requirements, review, UI research, test cases and Jira publication workflow.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity=".13"/></filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1l10 5-10 5z" fill="#475569"/></marker>
    <style>
      .title{font:700 38px 'Segoe UI',Arial,sans-serif;fill:#0f172a}.subtitle{font:400 19px 'Segoe UI',Arial,sans-serif;fill:#475569}
      .lane{fill:#fff;stroke:#cbd5e1;stroke-width:2}.laneTitle{font:700 22px 'Segoe UI',Arial,sans-serif;fill:#334155;letter-spacing:.4px}
      .box{stroke-width:2;rx:18;filter:url(#shadow)}.input{fill:#e8eef5;stroke:none;filter:none}.det{fill:#dcfce7;stroke:#22c55e}.llm{fill:#f3e8ff;stroke:#a855f7}.artifact{fill:#f3eee8;stroke:none;filter:none}.internal{fill:#f8fafc;stroke:#94a3b8;stroke-dasharray:8 6;filter:none}.mcp{fill:#cffafe;stroke:#0891b2;stroke-width:5;stroke-dasharray:16 7 3 7}
      .boxTitle{font:700 18px 'Segoe UI',Arial,sans-serif;fill:#172033}.boxText{font:400 15px 'Segoe UI',Arial,sans-serif;fill:#334155}.small{font:600 13px 'Segoe UI',Arial,sans-serif;fill:#64748b}.approval{fill:#2563eb}.approvalText{font:700 13px 'Segoe UI',Arial,sans-serif;fill:#fff}.arrow{fill:none;stroke:#475569;stroke-width:3;marker-end:url(#arrow)}.sectionArrow{fill:none;stroke:#6366f1;stroke-width:4;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1800" height="1900" fill="url(#bg)"/>
  <text x="70" y="70" class="title">QA multi-agent architecture</text>
  <text x="70" y="108" class="subtitle">From requirements to approved test cases and safe Jira publication</text>

  <g transform="translate(70 140)">
    <rect class="box input" width="250" height="58"/><text x="24" y="36" class="boxTitle">User input</text>
    <rect class="box artifact" x="280" width="250" height="58"/><text x="304" y="36" class="boxTitle">User-facing result</text>
    <rect class="box llm" x="560" width="250" height="58"/><text x="584" y="36" class="boxTitle">LLM work</text>
    <rect class="box det" x="840" width="250" height="58"/><text x="864" y="36" class="boxTitle">TS / deterministic</text>
    <rect class="box mcp" x="1120" width="210" height="58"/><text x="1144" y="36" class="boxTitle">Masked MCP</text>
    <circle class="approval" cx="1390" cy="29" r="21"/><text x="1382" y="35" class="approvalText">✓</text><text x="1425" y="36" class="boxText">Human-in-the-loop</text>
  </g>

  <!-- Requirements -->
  <rect class="lane" x="45" y="235" width="1710" height="250" rx="25"/><rect x="45" y="235" width="255" height="250" rx="25" fill="#eff6ff"/>
  <text x="78" y="285" class="laneTitle">1. REQUIREMENTS</text><text x="78" y="318" class="small">Retrieval and formatting</text>
  <g transform="translate(315 290)"><rect class="box input" width="210" height="110"/><text x="22" y="34" class="boxTitle">User input</text><text x="22" y="65" class="boxText">operation + source</text><text x="22" y="91" class="small">ID / ready text / run dir</text></g>
  <g transform="translate(570 290)"><rect class="box det" width="210" height="110"/><text x="20" y="34" class="boxTitle">extract-issue-key.ts</text><text x="20" y="68" class="boxText">extracts the issue key</text></g>
  <g transform="translate(825 275)"><rect class="box mcp" width="245" height="140"/><text x="22" y="35" class="boxTitle">Masked read MCP</text><text x="22" y="65" class="boxText">masked data only</text><text x="22" y="92" class="boxText">no cookies or tokens</text><text x="22" y="119" class="boxText">value-free audit</text></g>
  <g transform="translate(1115 290)"><rect class="box det" width="210" height="110"/><text x="18" y="34" class="boxTitle">extract-description.ts</text><text x="18" y="68" class="boxText">extracts the description</text></g>
  <g transform="translate(1370 290)"><rect class="box artifact" width="235" height="110"/><text x="20" y="38" class="boxTitle">requirements.md</text><text x="20" y="70" class="boxText">requirement only</text></g>
  <path class="arrow" d="M525 345H570"/><path class="arrow" d="M780 345H825"/><path class="arrow" d="M1070 345H1115"/><path class="arrow" d="M1325 345H1370"/>

  <!-- Review -->
  <rect class="lane" x="45" y="510" width="1710" height="250" rx="25"/><rect x="45" y="510" width="255" height="250" rx="25" fill="#faf5ff"/>
  <text x="78" y="560" class="laneTitle">2. REVIEW</text><text x="78" y="593" class="small">Completeness, clarity, and testability</text>
  <g transform="translate(335 565)"><rect class="box llm" width="275" height="130"/><text x="22" y="36" class="boxTitle">req-reviewer</text><text x="22" y="68" class="boxText">finds gaps and conflicts</text><text x="22" y="96" class="boxText">keeps source requirements unchanged</text></g>
  <g transform="translate(665 565)"><rect class="box artifact" width="250" height="130"/><text x="22" y="40" class="boxTitle">requirements-review.md</text><text x="22" y="72" class="boxText">questions and assumptions</text><circle class="approval" cx="227" cy="16" r="18"/><text x="220" y="21" class="approvalText">✓</text></g>
  <g transform="translate(970 580)"><rect class="box input" width="230" height="100"/><text x="20" y="32" class="boxTitle">User decision</text><text x="20" y="60" class="boxText">clarify / LLM / continue</text></g>
  <g transform="translate(1255 565)"><rect class="box input" width="250" height="130"/><text x="20" y="40" class="boxTitle">Human review</text><text x="20" y="72" class="boxText">resolve open questions</text></g>
  <path class="arrow" d="M610 630H665"/><path class="arrow" d="M915 630H970"/><path class="arrow" d="M1200 630H1255"/>

  <!-- UI -->
  <rect class="lane" x="45" y="785" width="1710" height="300" rx="25"/><rect x="45" y="785" width="255" height="300" rx="25" fill="#f0fdf4"/>
  <text x="78" y="835" class="laneTitle">3. UI RESEARCH</text><text x="78" y="868" class="small">Plan → Playwright → context</text>
  <g transform="translate(335 850)"><rect class="box llm" width="245" height="150"/><text x="20" y="35" class="boxTitle">UI plan creator</text><text x="20" y="68" class="boxText">requirements + review</text><text x="20" y="98" class="boxText">scope and UI-PLAN-NNN</text></g>
  <g transform="translate(630 850)"><rect class="box artifact" width="235" height="150"/><text x="20" y="40" class="boxTitle">ui-test-plan.md</text><text x="20" y="72" class="boxText">research items</text><circle class="approval" cx="212" cy="16" r="18"/><text x="205" y="21" class="approvalText">✓</text></g>
  <g transform="translate(915 850)"><rect class="box mcp" width="255" height="150"/><text x="20" y="35" class="boxTitle">Official Playwright MCP</text><text x="20" y="68" class="boxText">clean HTTPS URL</text><text x="20" y="98" class="boxText">user signs in manually</text><text x="20" y="124" class="small">permission for synthetic data if needed</text></g>
  <g transform="translate(1220 850)"><rect class="box det" width="245" height="150"/><text x="20" y="35" class="boxTitle">save-ui-observation.ts</text><text x="20" y="68" class="boxText">checks the observation</text><text x="20" y="98" class="boxText">saves JSON</text></g>
  <g transform="translate(1510 850)"><rect class="box det" width="195" height="150"/><text x="18" y="36" class="boxTitle">build-ui-context.ts</text><text x="18" y="68" class="boxText">output:</text><text x="18" y="92" class="boxText">ui-context.json</text></g>
  <g transform="translate(1510 1015)"><rect class="box artifact" width="195" height="55"/><text x="18" y="34" class="boxTitle">ui-context.json</text><circle class="approval" cx="172" cy="15" r="18"/><text x="165" y="20" class="approvalText">✓</text></g>
  <path class="arrow" d="M580 925H630"/><path class="arrow" d="M865 925H915"/><path class="arrow" d="M1170 925H1220"/><path class="arrow" d="M1465 925H1510"/><path class="arrow" d="M1607 1000V1015"/>

  <!-- Cases -->
  <rect class="lane" x="45" y="1110" width="1710" height="250" rx="25"/><rect x="45" y="1110" width="255" height="250" rx="25" fill="#fff7ed"/>
  <text x="78" y="1160" class="laneTitle">4. TEST CASES</text><text x="78" y="1193" class="small">Atomic cases and coverage</text>
  <g transform="translate(335 1165)"><rect class="box llm" width="275" height="130"/><text x="22" y="36" class="boxTitle">test-cases-creator</text><text x="22" y="68" class="boxText">requirements + UI context</text><text x="22" y="96" class="boxText">priority + automation fit</text></g>
  <g transform="translate(665 1165)"><rect class="box artifact" width="250" height="130"/><text x="22" y="40" class="boxTitle">test-cases.md</text><text x="22" y="72" class="boxText">TC-NNN + traceability</text><circle class="approval" cx="227" cy="16" r="18"/><text x="220" y="21" class="approvalText">✓</text></g>
  <g transform="translate(970 1180)"><rect class="box input" width="230" height="100"/><text x="20" y="32" class="boxTitle">User approval</text><text x="20" y="60" class="boxText">approve the cases</text></g>
  <g transform="translate(1255 1165)"><rect class="box det" width="250" height="130"/><text x="20" y="40" class="boxTitle">validate-test-cases.ts</text><text x="20" y="72" class="boxText">checks TC-NNN and links</text></g>
  <path class="arrow" d="M610 1230H665"/><path class="arrow" d="M915 1230H970"/><path class="arrow" d="M1200 1230H1255"/>

  <!-- Jira -->
  <rect class="lane" x="45" y="1385" width="1710" height="250" rx="25"/><rect x="45" y="1385" width="255" height="250" rx="25" fill="#eff6ff"/>
  <text x="78" y="1435" class="laneTitle">5. JIRA PUBLICATION</text><text x="78" y="1468" class="small">Preview before POST</text>
  <g transform="translate(335 1440)"><rect class="box artifact" width="275" height="130"/><text x="22" y="36" class="boxTitle">jira-task-preview.md</text><text x="22" y="68" class="boxText">full list of issues</text><circle class="approval" cx="252" cy="16" r="18"/><text x="245" y="21" class="approvalText">✓</text></g>
  <g transform="translate(665 1440)"><rect class="box input" width="250" height="130"/><text x="22" y="40" class="boxTitle">Project + permission</text><text x="22" y="72" class="boxText">separate approval</text></g>
  <g transform="translate(970 1440)"><rect class="box mcp" width="230" height="130"/><text x="20" y="40" class="boxTitle">jira-write MCP</text><text x="20" y="72" class="boxText">approved POST only</text></g>
  <g transform="translate(1255 1440)"><rect class="box det" width="250" height="130"/><text x="20" y="32" class="boxTitle">validate-external-</text><text x="20" y="56" class="boxTitle">test-cases-map.ts</text><text x="20" y="90" class="boxText">checks the Jira map</text></g>
  <path class="arrow" d="M610 1505H665"/><path class="arrow" d="M915 1505H970"/><path class="arrow" d="M1200 1505H1255"/>

  <path class="sectionArrow" d="M1705 455h30v55h-30"/><path class="sectionArrow" d="M1705 760h30v25h-30"/><path class="sectionArrow" d="M1705 1085h30v25h-30"/><path class="sectionArrow" d="M1705 1360h30v25h-30"/>
  <text x="70" y="1730" class="small">✓ marks a Human-in-the-loop artifact that requires human review or approval before the next stage.</text>
  <text x="70" y="1760" class="small">Security boundary: secrets, cookies, storage state and authorization headers are never read or persisted.</text>
</svg>
